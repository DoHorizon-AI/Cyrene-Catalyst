schema_version: cyrene.repository-policy.v1
repository:
  logical_name: cyrene-catalyst
  lifecycle_class: PUBLIC_PRODUCT
  # Desired publication policy; live hosting visibility is verified separately.
  visibility: public
  source_owner: Dialogue & Synthesis Team
  remote_default_branch: main
  integration_branch: main
  release_branch: main
  default_branch: main
ownership:
  owns:
  - Dataset and DatasetVersion lifecycle state
  - Data preparation intent, review policy, quality gates, and Product lineage
  - Explicit handoff requests to owning Products such as Yield and Echo
  does_not_own:
  - Kernel execution substrate
  - Platform Artifact Plane implementation or generic artifact provider code
  - Capability payload contracts, generated capability SDKs, or capability TCKs
  - Concrete dataset parsing, normalization, deduplication, transformation, or split algorithms
  - Platform capability resolution, ModelVersion state, or training execution
build:
  independent: true
  build_systems:
  - pyproject
artifacts:
  package_units:
  - cyrene-catalyst
  native_binaries: []
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - dialogue_ext
  standalone_user_product: false
integration:
  multi_repo_required: true
authorities:
  ci: github
  release: github_releases
  deployment: dohorizon_azure
trust:
  # The pinned Plugins revision is private until the dependency closure is published.
  public_requires_private: true
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: false
