name: $(Date:yyyyMMdd)$(Rev:.r)

# Catalyst targets public source distribution: GitHub Actions owns automatic
# source and contract checks. The live GitHub repository remains private until
# an owner changes visibility. Keep this Azure definition manual for future
# deployment or private integration work.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
- job: catalyst_product_contract
  displayName: 'Catalyst / Product Contract and MVP'
  timeoutInMinutes: 15
  variables:
    UV_CACHE_DIR: '$(Pipeline.Workspace)/.cache/uv'
  steps:
  - checkout: self
    path: s/Cyrene-Catalyst
    persistCredentials: true
    displayName: 'Checkout repository'
  - task: Cache@2
    inputs:
      key: 'uv | "$(Agent.OS)" | "$(Build.Repository.Name)" | Cyrene-Catalyst/uv.lock'
      restoreKeys: |
        uv | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/.cache/uv'
    displayName: 'Restore uv dependency cache'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Setup Python 3.12'

  - bash: |
      set -euo pipefail
      python -m pip install uv==0.12.3
      python -m json.tool service.json >/dev/null
      uv sync --locked --group dev
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Catalyst
    displayName: Install locked dependencies from Catalyst only

  - bash: |
      set -euo pipefail
      uv run --no-sync ruff check src tests
      uv run --no-sync mypy
      uv run --no-sync pytest -q tests --junitxml=test-results.xml
      uv run --no-sync python - <<'PY'
      from pathlib import Path
      from openapi_spec_validator import validate
      from openapi_spec_validator.readers import read_from_filename
      for path in Path("contracts/product/v1").glob("*openapi.yaml"):
          document, base = read_from_filename(str(path.resolve()))
          validate(document, base_uri=base)
          print("Validated", path.name)
      PY
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Catalyst
    displayName: Product lint, type, unit, contract and OpenAPI checks

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '$(Pipeline.Workspace)/s/Cyrene-Catalyst/test-results.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

- job: publish_evidence
  displayName: 'Catalyst / Assemble Evidence'
  dependsOn: catalyst_product_contract
  condition: succeeded()
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - script: |
      mkdir -p ci/evidence
      cat <<EOT > ci/evidence/summary.json
      {
        "suite": "Cyrene-Catalyst-Baseline",
        "commit": "$(Build.SourceVersion)",
        "pipeline": "$(Build.DefinitionName)",
        "build_id": "$(Build.BuildId)",
        "result": "CLEAN_CORE_PASS",
        "hosted_gpu": "NOT_RUN",
        "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      }
      EOT
    displayName: 'Generate Evidence Ledger'

  - publish: ci/evidence
    artifact: catalyst-evidence
    displayName: 'Publish Catalyst Evidence'

- job: legacy_surface_governance
  displayName: 'Governance / Legacy-Reintroduction Guard'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self
    path: s/Cyrene-Catalyst
    persistCredentials: true
  - bash: |
      set -euo pipefail
      bash tooling/ci/check-product-boundary.sh
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Catalyst
    displayName: 'Reject Platform source and closed ArtifactKind coupling'
