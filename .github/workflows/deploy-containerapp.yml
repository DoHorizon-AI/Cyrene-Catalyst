name: cd-containerapp

on:
  push:
    branches: [main, release, develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git sha)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    name: cd / build, push & deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AZURE_RESOURCE_GROUP: Container-APP
      AZURE_APP_NAME: cyrene-catalyst
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      WORKSPACE_SERVICE_AUTH_SECRET_URI: ${{ vars.WORKSPACE_SERVICE_AUTH_SECRET_URI }}
      WORKSPACE_SERVICE_AUTH_IDENTITY: ${{ vars.WORKSPACE_SERVICE_AUTH_IDENTITY }}

    steps:
      - name: Require Azure OIDC configuration
        run: |
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!variable}" ]; then
              echo "$variable is required for ACA deployment" >&2
              exit 1
            fi
          done

      - name: Validate optional Workspace auth reference
        id: workspace-auth
        shell: bash
        run: |
          if [[ -z "$WORKSPACE_SERVICE_AUTH_SECRET_URI" && -z "$WORKSPACE_SERVICE_AUTH_IDENTITY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Workspace auth reference is not configured; leaving ACA auth settings unchanged."
            exit 0
          fi

          if [[ -z "$WORKSPACE_SERVICE_AUTH_SECRET_URI" || -z "$WORKSPACE_SERVICE_AUTH_IDENTITY" ]]; then
            echo "Both Workspace auth reference variables must be configured together." >&2
            exit 1
          fi

          if [[ ! "$WORKSPACE_SERVICE_AUTH_SECRET_URI" =~ ^https://([A-Za-z0-9-]+)\.vault\.azure\.net/secrets/([A-Za-z0-9-]+)$ ]]; then
            echo "Workspace auth secret URI must be a versionless Azure Key Vault secret URI." >&2
            exit 1
          fi
          echo "vault_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "secret_name=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

          if [[ "$WORKSPACE_SERVICE_AUTH_IDENTITY" != "system" && ! "$WORKSPACE_SERVICE_AUTH_IDENTITY" =~ ^/subscriptions/[^[:space:]/]+/resourceGroups/[^[:space:]/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^[:space:]/]+$ ]]; then
            echo "Workspace auth identity must be 'system' or a managed identity resource ID." >&2
            exit 1
          fi

          secret_suffix=$(printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-12)
          if [[ ! "$secret_suffix" =~ ^[[:xdigit:]]{12}$ ]]; then
            echo "Could not derive a safe per-run ACA secret name." >&2
            exit 1
          fi
          echo "aca_secret_name=ws-auth-${secret_suffix}" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Cyrene-Catalyst
        uses: actions/checkout@v5
        with:
          path: Cyrene-Services/Cyrene-Catalyst

      - name: Fetch sibling repositories (Cyrene-Platform & Cyrene-Plugins-Official)
        run: |
          TARGET_BRANCH="${GITHUB_REF_NAME:-develop}"
          for name in Cyrene-Platform Cyrene-Plugins-Official; do
            echo "Fetching $name (target branch: $TARGET_BRANCH)..."
            git clone --quiet --depth 1 --branch "$TARGET_BRANCH" "https://github.com/DoHorizon-AI/$name.git" "$name" 2>/dev/null || \
            git clone --quiet --depth 1 --branch develop "https://github.com/DoHorizon-AI/$name.git" "$name" 2>/dev/null || \
            git clone --quiet --depth 1 "https://github.com/DoHorizon-AI/$name.git" "$name"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/cyrene-catalyst"
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Cyrene-Services/Cyrene-Catalyst/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Require internal ACA ingress before changes
        shell: bash
        run: |
          ingress_external=$(az containerapp show \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.external" \
            --output tsv)
          if [[ "$ingress_external" != "false" ]]; then
            echo "Refusing ACA update because Product ingress is not confirmed internal." >&2
            exit 1
          fi
          if [[ "${{ steps.workspace-auth.outputs.enabled }}" == "true" ]]; then
            revision_mode=$(az containerapp show \
              --name "$AZURE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.configuration.activeRevisionsMode" \
              --output tsv | tr '[:upper:]' '[:lower:]')
            if [[ "$revision_mode" != "single" ]]; then
              echo "Workspace auth rollout requires single revision mode so an unready revision cannot take traffic." >&2
              exit 1
            fi
          fi

      - name: Preflight Workspace auth target
        if: steps.workspace-auth.outputs.enabled == 'true'
        shell: bash
        run: |
          secret_enabled=$(az keyvault secret list \
            --vault-name "${{ steps.workspace-auth.outputs.vault_name }}" \
            --query "[?name=='${{ steps.workspace-auth.outputs.secret_name }}'].attributes.enabled | [0]" \
            --output tsv)
          if [[ "$secret_enabled" != "true" ]]; then
            echo "Workspace auth Key Vault secret is missing or disabled." >&2
            exit 1
          fi

          if [[ "$WORKSPACE_SERVICE_AUTH_IDENTITY" == "system" ]]; then
            principal_id=$(az containerapp show \
              --name "$AZURE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "identity.principalId" \
              --output tsv)
            if [[ -z "$principal_id" || "$principal_id" == "None" ]]; then
              echo "Workspace auth system identity is not assigned to the Container App." >&2
              exit 1
            fi
          else
            assigned_identities=$(az containerapp show \
              --name "$AZURE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "identity.userAssignedIdentities" \
              --output json)
            if ! jq -e --arg identity "$WORKSPACE_SERVICE_AUTH_IDENTITY" \
              'to_entries | any(.key | ascii_downcase == ($identity | ascii_downcase))' \
              <<< "$assigned_identities" >/dev/null; then
              echo "Workspace auth user-assigned identity is not assigned to the Container App." >&2
              exit 1
            fi
          fi

      - name: Register Workspace auth Key Vault reference
        if: steps.workspace-auth.outputs.enabled == 'true'
        shell: bash
        run: |
          az containerapp secret set \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets "${{ steps.workspace-auth.outputs.aca_secret_name }}=keyvaultref:${WORKSPACE_SERVICE_AUTH_SECRET_URI},identityref:${WORKSPACE_SERVICE_AUTH_IDENTITY}" \
            --only-show-errors \
            --output none

      - name: Update Azure Container App
        shell: bash
        run: |
          if [[ "${{ steps.workspace-auth.outputs.enabled }}" == "true" ]]; then
            az containerapp update \
              --name "$AZURE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "${{ steps.meta.outputs.full_image }}" \
              --set-env-vars "CYRENE_WORKSPACE_SERVICE_AUTH_JSON=secretref:${{ steps.workspace-auth.outputs.aca_secret_name }}"
          else
            az containerapp update \
              --name "$AZURE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "${{ steps.meta.outputs.full_image }}"
          fi

      - name: Verify healthy internal revision
        run: |
          for i in {1..60}; do
            INGRESS_EXTERNAL=$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.external" -o tsv)
            if [ "$INGRESS_EXTERNAL" != "false" ]; then
              echo "Product ingress is not internal" >&2
              exit 1
            fi
            REVISION=$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.latestRevisionName" -o tsv)
            READY=$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.latestReadyRevisionName" -o tsv)
            if [ -n "$REVISION" ] && [ "$REVISION" = "$READY" ]; then
              HEALTH=$(az containerapp revision show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$REVISION" --query "properties.healthState" -o tsv)
              IMAGE=$(az containerapp revision show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$REVISION" --query "properties.template.containers[0].image" -o tsv)
              if [ "$HEALTH" = "Healthy" ] && [ "$IMAGE" = "${{ steps.meta.outputs.full_image }}" ]; then
                echo "Healthy internal revision: $REVISION ($IMAGE)"
                exit 0
              fi
            fi
            echo "Waiting for healthy revision with image ${{ steps.meta.outputs.full_image }} ($i/60)"
            sleep 3
          done
          echo "Product revision did not become healthy with the expected image" >&2
          exit 1
