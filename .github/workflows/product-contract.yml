name: Product contract and MVP

on:
  pull_request:
    branches: [develop, main, release]
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - run: python -m json.tool service.json >/dev/null
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: bash tooling/ci/check-product-boundary.sh
      - run: uv run pytest -q
      - run: uv run openapi-spec-validator contracts/product/v1/openapi.yaml

  publish-artifact:
    name: ci / immutable-artifact
    if: github.event_name != 'pull_request'
    needs: [product-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install locked packaging tool
        run: python -m pip install --disable-pip-version-check uv==0.12.3
      - name: Build immutable release bundle
        env:
          ARTIFACT_NAME: cyrene-catalyst-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="Cyrene-Catalyst-${GITHUB_SHA}/" "${GITHUB_SHA}" \
            > "dist/cyrene-catalyst-${GITHUB_SHA}.source.tar.gz"
          uv build --wheel --out-dir dist .
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          payload = []
          for path in sorted(dist.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              payload.append(
                  {
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "kind": "release-payload",
                  }
              )
          if not payload:
              raise SystemExit("artifact payload is empty")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "payload": payload,
          }
          (dist / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-catalyst-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
