name: publish-container

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git sha)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: cd / build and push container image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEP_PLATFORM_REV: 06a9bd75edfed1359b09770e749520162d75e242
      DEP_PLUGINS_REV: a41284c2ffe71a7412f556841f9ccc4a91864138

    steps:
      - name: Checkout Cyrene-Catalyst
        uses: actions/checkout@v4
        with:
          path: Cyrene-Services/Cyrene-Catalyst

      - name: Fetch sibling repositories (Platform & Plugins)
        run: |
          for entry in "Cyrene-Platform:$DEP_PLATFORM_REV" \
                       "Cyrene-Plugins-Official:$DEP_PLUGINS_REV"; do
            target="${entry%%:*}"
            revision="${entry#*:}"
            repo_name="$(basename "$target")"
            mkdir -p "$target"
            git init --quiet "$target"
            git -C "$target" remote add origin "https://github.com/DoHorizon-AI/$repo_name.git"
            git -C "$target" fetch --quiet --depth 1 origin "$revision"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/cyrene-catalyst"
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Cyrene-Services/Cyrene-Catalyst/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Create service update manifest
        id: update-manifest
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SERVICE_ID: cyrene-catalyst
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source_commit = os.environ["SOURCE_COMMIT"]
          image_digest = os.environ["IMAGE_DIGEST"]
          version = os.environ["IMAGE_TAG"]
          if re.fullmatch(r"[0-9a-f]{40}", source_commit) is None:
              raise SystemExit("GITHUB_SHA must be a full 40-character commit SHA")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest) is None:
              raise SystemExit("build-push-action did not return a full sha256 image digest")
          if not version or len(version) > 128:
              raise SystemExit("image tag must be a non-empty version of at most 128 characters")

          manifest = {
              "schemaVersion": 1,
              "serviceId": os.environ["SERVICE_ID"],
              "version": version,
              "sourceCommit": source_commit,
              "image": {
                  "repository": os.environ["IMAGE_REPOSITORY"],
                  "digest": image_digest,
              },
              "platform": {"os": "linux", "arch": "amd64"},
          }
          Path("service-update-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload service update manifest
        uses: actions/upload-artifact@v4
        with:
          name: service-update-manifest-cyrene-catalyst
          path: service-update-manifest.json
          if-no-files-found: error
          retention-days: 30
