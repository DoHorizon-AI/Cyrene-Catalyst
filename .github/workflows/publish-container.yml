name: publish-container

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git sha)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: cd / build and push container image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEP_PLATFORM_REV: 06a9bd75edfed1359b09770e749520162d75e242
      DEP_PLUGINS_REV: a41284c2ffe71a7412f556841f9ccc4a91864138

    steps:
      - name: Checkout Cyrene-Catalyst
        uses: actions/checkout@v4
        with:
          path: Cyrene-Services/Cyrene-Catalyst

      - name: Fetch sibling repositories (Platform & Plugins)
        run: |
          for entry in "Cyrene-Platform:$DEP_PLATFORM_REV" \
                       "Cyrene-Plugins-Official:$DEP_PLUGINS_REV"; do
            target="${entry%%:*}"
            revision="${entry#*:}"
            repo_name="$(basename "$target")"
            mkdir -p "$target"
            git init --quiet "$target"
            git -C "$target" remote add origin "https://github.com/DoHorizon-AI/$repo_name.git"
            git -C "$target" fetch --quiet --depth 1 origin "$revision"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/cyrene-catalyst"
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Cyrene-Services/Cyrene-Catalyst/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
